# ─────────────────────────────────────────────────────────────────
# Touche AI Limited — Risk Bütçesi
# AEGIS Holding | Teknik Analiz Motoru v1.0
# ─────────────────────────────────────────────────────────────────

risk:
  max_risk_per_trade_pct: 1.0      # İşlem başına max %1 sermaye riski
  max_daily_drawdown_pct:  3.0     # Günlük max %3 kayıp
  max_weekly_drawdown_pct: 7.0     # Haftalık max %7 kayıp
  max_open_positions: 3            # Max eş zamanlı açık pozisyon
  max_correlated_positions: 2      # Yüksek korelasyonlu max pozisyon

position_sizing:
  method: "fixed_risk"             # fixed_risk | kelly | fixed_lot
  kelly_fraction: 0.25             # Güvenlik için Quarter Kelly
  min_lot_size: 0.001
  max_lot_size: 10.0
  min_position_usd: 10.0

sl_tp:
  sl_method: "atr_based"          # atr_based | swing_point | fixed_pips
  sl_atr_multiplier: 1.5          # SL = Giriş ± (ATR × 1.5)
  tp_method: "rr_ratio"           # rr_ratio | structure | fibonacci
  default_rr_ratio: 2.0           # TP = Giriş + (SL_Mesafe × 2.0)
  tp_fibonacci_levels:
    - 1.618
    - 2.618

filters:
  min_eqs_score: 50               # İşlem için minimum EQS skoru
  min_adr_pct: 0.5                # Min günlük fiyat değişimi %
  max_spread_pips: 5              # Kabul edilebilir max spread
  avoid_high_impact_news: true    # Yüksek etkili haberlerden önce/sonra işlem yapma
  news_buffer_minutes: 30         # Haber öncesi/sonrası tampon süre (dakika)
