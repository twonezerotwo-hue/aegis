correlation_overrides:
  risk_on:
    condition: "BTC-SP500/QQQ/HYG rolling corr > 0.7"
    modifier: "multiply"  # Boost selected weights
    weights_boost:
      touche: 1.15
      quantum: 1.10
      sentinel: 1.05
    weights: {touche: 0.30, fundamental: 0.35, news: 0.10, sentinel: 0.20, quantum: 0.05}
  decoupling:
    condition: "BTC-macro corr < 0.3 AND DXY corr < -0.4"
    modifier: "override"  # Full override for crypto-native regime
    weights: {touche: 0.20, fundamental: 0.50, news: 0.10, sentinel: 0.15, quantum: 0.05}
  stress:
    condition: "PCA signal < -1.5 OR DXY spike > 2σ"
    modifier: "override"
    weights: {touche: 0.15, fundamental: 0.45, news: 0.20, sentinel: 0.15, quantum: 0.05}
    kelly_cap: 0.05  # Hard cap during stress
  default:
    modifier: "none"  # No change

