# === EVENT-AWARE WEIGHT OVERRIDES (Option B - v7.3) ===
# Modify module weights based on event_hint parameter
# modifier: "multiply" = boost selected weights & renormalize | "override" = full replacement
event_overrides:

  # CRASH / DUMP / BANK_CRISIS — Defensive macro focus
  crash_events:
    event_hints: ["CRASH", "DUMP", "BANK_CRISIS", "CONTAGION", "LIQUIDATION_SPIKE"]
    modifier: "override"
    weights:
      touche: 0.20
      fundamental: 0.45
      news: 0.10
      sentinel: 0.20
      quantum: 0.05
    kelly_cap: 0.15
    rationale: "Capital preservation: macro + fundamental dominance"

  # PUMP / ATH / BREAKOUT / ETF — Momentum + news focus
  pump_events:
    event_hints: ["PUMP", "ATH", "BREAKOUT", "ETF_PUMP", "FOMO_SURGE"]
    modifier: "multiply"
    weights_boost:
      touche: 1.20
      news: 1.50
      sentinel: 0.90
    rationale: "Momentum capture: technical + news synergy"

  # STRUCTURAL events (Halving, Fork, Upgrade) — Fundamental + news blend
  structural_events:
    event_hints: ["HALVING", "FORK", "UPGRADE", "MAINNET_LAUNCH"]
    modifier: "override"
    weights:
      touche: 0.25
      fundamental: 0.45
      news: 0.20
      sentinel: 0.08
      quantum: 0.02
    rationale: "Structural shifts: fundamental value + narrative alignment"

  # RECOVERY / CONSOLIDATION — Use regime weights as-is
  recovery_events:
    event_hints: ["RECOVERY", "CONSOLIDATION", "SIDEWAYS"]
    modifier: "none"
    rationale: "Baseline regime weights apply"
