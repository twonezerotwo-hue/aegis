services:
  # Data Storage
  postgres:
    image: postgres:15-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegis_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aegis_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: aegis-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-aegis}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_pass}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - aegis_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: aegis-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - aegis_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: aegis-postgres-exporter
    command:
      - '--config.file=/etc/postgres_exporter.yml'
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis_secure_pass}@postgres:5432/${POSTGRES_DB:-aegis}?sslmode=disable"
    volumes:
      - ./postgres_exporter.yml:/etc/postgres_exporter.yml:ro
    networks:
      - aegis_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: aegis-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - aegis_network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:latest
    container_name: aegis-pushgateway
    ports:
      - "9091:9091"
    networks:
      - aegis_network
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  metrics-pusher:
    build:
      context: .
      dockerfile: Dockerfile.metrics
    container_name: aegis-metrics-pusher
    environment:
      PUSHGATEWAY_URL: "http://pushgateway:9091"
    networks:
      - aegis_network
    depends_on:
      - pushgateway
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: aegis-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_PLUGIN_ADMIN_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/aegis-datasources.yaml
      - ./grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards/files
    ports:
      - "3000:3000"
    networks:
      - aegis_network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Streamlit Dashboard (DEPRECATED - using Grafana instead)
  # dashboard:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.dashboard
  #   container_name: aegis-dashboard
  #   ports:
  #     - "8501:8501"
  #   networks:
  #     - aegis_network
  #   depends_on:
  #     - prometheus
  #   restart: unless-stopped

  # API Gateway
  nginx:
    image: nginx:alpine
    container_name: aegis-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    networks:
      - aegis_network
    depends_on:
      - touche-api
      - fundamental-api
      - quantum-api
      - sentinel-api
      - consensus-api
      - news-ai-limited
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # AI Modules
  touche-api:
    build:
      context: .
      dockerfile: Dockerfile.touche
    container_name: aegis-touche
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aegis:aegis_secure_pass@postgres:5432/aegis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: touche-ai
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
      DATA_MODE: ${DATA_MODE:-LIVE}
      BINANCE_TIMEOUT: ${BINANCE_TIMEOUT:-5.0}
      BINANCE_RATE_LIMIT_PER_MIN: ${BINANCE_RATE_LIMIT_PER_MIN:-1200}
    ports:
      - "8001:8001"
    networks:
      aegis_network:
      aegis_clean_v71_aegis_network:
        aliases:
          - touche-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  fundamental-api:
    build:
      context: .
      dockerfile: Dockerfile.fundamental
    container_name: aegis-fundamental
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aegis:aegis_secure_pass@postgres:5432/aegis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: fundamental-ai
      GLASSNODE_API_KEY: ${GLASSNODE_API_KEY}
      CRYPTOQUANT_API_KEY: ${CRYPTOQUANT_API_KEY}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY}
      TWELVE_DATA_BASE_URL: ${TWELVE_DATA_BASE_URL:-https://api.twelvedata.com}
    ports:
      - "8002:8002"
    networks:
      aegis_network:
      aegis_clean_v71_aegis_network:
        aliases:
          - fundamental-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  quantum-api:
    build:
      context: .
      dockerfile: Dockerfile.quantum
    container_name: aegis-quantum
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aegis:aegis_secure_pass@postgres:5432/aegis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: quantum-ai
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
    ports:
      - "8003:8003"
    networks:
      aegis_network:
      aegis_clean_v71_aegis_network:
        aliases:
          - quantum-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  sentinel-api:
    build:
      context: .
      dockerfile: Dockerfile.sentinel
    container_name: aegis-sentinel
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aegis:aegis_secure_pass@postgres:5432/aegis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: sentinel-ai
      MAX_POSITION_SIZE: ${MAX_POSITION_SIZE:-1000}
      MAX_DAILY_LOSS_PCT: ${MAX_DAILY_LOSS_PCT:-2.0}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY}
      TWELVE_DATA_BASE_URL: ${TWELVE_DATA_BASE_URL:-https://api.twelvedata.com}
      MACRO_DATA_PROVIDER: ${MACRO_DATA_PROVIDER:-twelve}
      SENTINEL_DXY_THRESHOLD: ${SENTINEL_DXY_THRESHOLD:-104}
      SENTINEL_VIX_THRESHOLD: ${SENTINEL_VIX_THRESHOLD:-20}
      SENTINEL_US10Y_THRESHOLD: ${SENTINEL_US10Y_THRESHOLD:-4.5}
      SENTINEL_BRENT_THRESHOLD: ${SENTINEL_BRENT_THRESHOLD:-95}
      SENTINEL_XAU_THRESHOLD: ${SENTINEL_XAU_THRESHOLD:-2100}
    ports:
      - "8004:8004"
    networks:
      aegis_network:
      aegis_clean_v71_aegis_network:
        aliases:
          - sentinel-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  consensus-api:
    build:
      context: .
      dockerfile: Dockerfile.consensus
    container_name: aegis-consensus
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aegis:aegis_secure_pass@postgres:5432/aegis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: consensus-engine
      MAX_POSITION_SIZE: ${MAX_POSITION_SIZE:-1000}
      MAX_DAILY_LOSS_PCT: ${MAX_DAILY_LOSS_PCT:-2.0}
      MULTIPLIER_FLOOR: ${MULTIPLIER_FLOOR:-0.1}
      MULTIPLIER_CEILING: ${MULTIPLIER_CEILING:-1.0}
      CONSENSUS_PHASE: ${CONSENSUS_PHASE:-1}
    ports:
      - "8005:8005"
    networks:
      aegis_network:
      aegis_clean_v71_aegis_network:
        aliases:
          - consensus-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      news-ai-limited:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Optuna Optimizer Service
  optimizer-api:
    build:
      context: .
      dockerfile: optimizer_service/Dockerfile
    container_name: aegis-optimizer
    environment:
      REDIS_URL: ${REDIS_URL:-redis://aegis-redis:6379/0}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://aegis:aegis_password@aegis-postgres:5432/aegis_db}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKTEST_USE_MOCK: "true"
      CONSENSUS_CONFIG_PATH: /app/consensus_engine/config/consensus_weights.yaml
      OPTIMIZER_CONFIGS_DIR: /app/optimizer_service/configs
      OPTIMIZER_TRIALS_DIR: /app/optimizer_service/trials
    ports:
      - "8008:8008"
    volumes:
      - ./consensus_engine/config:/app/consensus_engine/config
      - ./optimizer_service/configs:/app/optimizer_service/configs
      - ./optimizer_service/trials:/app/optimizer_service/trials
    networks:
      - aegis_network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # React Dashboard Frontend
  dashboard-frontend:
    build:
      context: ./dashboard_react/frontend
      args:
        VITE_API_URL: "http://localhost:8502"
    container_name: aegis-dashboard-frontend
    environment:
      VITE_API_URL: "http://localhost:8502"
    ports:
      - "3001:3001"
    networks:
      - aegis_network
    depends_on:
      - dashboard-backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # FastAPI Dashboard Backend
  dashboard-backend:
    build:
      context: ./dashboard_react/backend
    container_name: aegis-dashboard-backend
    environment:
      DASHBOARD_API_PORT: "8502"
      PROMETHEUS_URL: "http://prometheus:9090"
      CONSENSUS_URL: "http://consensus-api:8005"
      TOUCHE_URL: "http://touche-api:8001"
      FUNDAMENTAL_URL: "http://fundamental-api:8002"
      QUANTUM_URL: "http://quantum-api:8003"
      SENTINEL_URL: "http://sentinel-api:8004"
      NEWS_URL: "http://news-ai-limited:8006"
      ANALYZER_URL: "http://analyzer-ai:8007"
      BINANCE_API_KEY: "${BINANCE_API_KEY}"
      BINANCE_API_SECRET: "${BINANCE_API_SECRET}"
      BINANCE_BASE_URL: "${BINANCE_BASE_URL:-https://api.binance.com}"
      DRY_RUN: "${DRY_RUN:-true}"
      LIVE_TIMEFRAMES: "${LIVE_TIMEFRAMES:-4h,1d}"
      MAX_RISK_PER_TRADE: "${MAX_RISK_PER_TRADE:-0.02}"
      KILL_SWITCH_DRAWDOWN: "${KILL_SWITCH_DRAWDOWN:-0.10}"
      EXECUTION_MODE: "${EXECUTION_MODE:-DRY_RUN}"
      # ── Otonom Agent (GÜVENLİ-VARSAYILAN: kapalı) ──────────────────────
      AGENT_ENABLED: "${AGENT_ENABLED:-false}"
      AGENT_INTERVAL_SEC: "${AGENT_INTERVAL_SEC:-300}"
      AGENT_SYMBOLS: "${AGENT_SYMBOLS:-BTC/USDT,ETH/USDT}"
      AGENT_TIMEFRAME: "${AGENT_TIMEFRAME:-4h}"
      AGENT_HORIZON: "${AGENT_HORIZON:-medium}"
      AGENT_MIN_CONFIDENCE: "${AGENT_MIN_CONFIDENCE:-0.62}"
      AGENT_MIN_SCORE_EDGE: "${AGENT_MIN_SCORE_EDGE:-0.08}"
      AGENT_MAX_SIGNALS_DAY: "${AGENT_MAX_SIGNALS_DAY:-6}"
      AGENT_RISK_PCT: "${AGENT_RISK_PCT:-0.02}"
      AGENT_SIGNAL_TTL_MIN: "${AGENT_SIGNAL_TTL_MIN:-30}"
      AGENT_DATA_DIR: "/app/data"
      # ── Bildirim (opsiyonel — Telegram bot token + chat id ekleyince aktif) ──
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    ports:
      - "8502:8502"
    volumes:
      - ./backtest:/app/backtest
      - ./strategies:/app/strategies
      - ./consensus_engine/config:/app/consensus_engine/config
      - agent_data:/app/data
    networks:
      - aegis_network
    depends_on:
      - prometheus
      - touche-api
      - fundamental-api
      - quantum-api
      - sentinel-api
      - consensus-api
      - news-ai-limited
      - analyzer-ai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Macro Bridge - Streamlit macro regime bridge service
  macro-bridge:
    build:
      context: ./macro_bridge
    container_name: aegis-macro-bridge
    command: ["streamlit", "run", "dashboard/app.py", "--server.port", "8503", "--server.address", "0.0.0.0"]
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8503:8503"
    networks:
      - aegis_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8503', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Analyzer AI - Advanced Analysis & Reporting
  analyzer-ai:
    build:
      context: ./strategies/analyzer_ai
    container_name: aegis-analyzer
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: analyzer-ai
    ports:
      - "8007:8007"
    networks:
      - aegis_network
    depends_on:
      - touche-api
      - fundamental-api
      - quantum-api
      - sentinel-api
      - news-ai-limited
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # News AI Limited - Regulatory & Market News Analysis
  news-ai-limited:
    build:
      context: .
      dockerfile: modules/news-ai-limited/Dockerfile
    container_name: aegis-news-ai
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aegis:aegis_secure_pass@postgres:5432/aegis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: news-ai-limited
      SENTIMENT_MODEL: ${SENTIMENT_MODEL:-finbert}
      NEWS_UPDATE_INTERVAL_MINUTES: ${NEWS_UPDATE_INTERVAL_MINUTES:-15}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
    ports:
      - "8006:8006"
    networks:
      - aegis_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Qdrant Vector Database (CBR similarity search)
  qdrant:
    image: qdrant/qdrant:v1.7.3
    container_name: aegis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aegis_network
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  aegis_network:
    driver: bridge
  # Nginx + diğer legacy servislerin ulaşabilmesi için external ağ.
  # Container restart'ta alias'ların kaybolmasını önler — compose kalıcı yönetir.
  aegis_clean_v71_aegis_network:
    external: true
    name: aegis_clean_v71_aegis_network

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
  qdrant_data:
  agent_data:        # Agent karar günlüğü kalıcılığı (recreate'te korunur)
